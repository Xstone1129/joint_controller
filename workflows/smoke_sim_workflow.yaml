name: smoke_sim_workflow
power_on_at_start: true
power_off_at_end: false

topics:
  power: /robot_poweron
  joint_absolute: /arm_joint_absolute_cmd
  joint_state: /arm/joint_states
  motion_status: /arm/arm_controller/motion_status

services:
  cartesian_increment: /cartesian_increment_control

defaults:
  joint_vel: 0.5
  joint_acc: 0.5
  cartesian_vel: 0.02
  cartesian_acc: 0.05
  motion_timeout: 20.0
  position_tolerance: 0.05
  wait_motion: true
  confirm_after: false
  delay_after: 0.0

initial_pose:
  l1: 0.0
  l2: 0.0
  l3: 0.0
  l4: 0.0
  l5: 0.0
  l6: 0.0
  l7: 0.0
  r1: 0.0
  r2: 0.0
  r3: 0.0
  r4: 0.0
  r5: 0.0
  r6: 0.0
  r7: 0.0

poses:
  抱大箱准备姿态:
    l1: 0.0
    l2: 0.8
    l3: 0.0
    l4: -1.5
    l5: 0.0
    l6: 0.0
    l7: 0.0
    r1: 0.0
    r2: -0.8
    r3: 0.0
    r4: 1.5
    r5: 0.0
    r6: 0.0
    r7: 0.0
  全零位:
    l1: 0.0
    l2: 0.0
    l3: 0.0
    l4: 0.0
    l5: 0.0
    l6: 0.0
    l7: 0.0
    r1: 0.0
    r2: 0.0
    r3: 0.0
    r4: 0.0
    r5: 0.0
    r6: 0.0
    r7: 0.0

steps:
  - name: 到抱大箱准备姿态
    action: joint
    pose: 抱大箱准备姿态
    order: [lrjoint2, lrjoint4]
  - name: 回零
    action: joint
    pose: 全零位
    order: [lrjoint4, lrjoint2]
