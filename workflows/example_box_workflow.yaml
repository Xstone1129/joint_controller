name: box_grasp_lift_workflow
power_on_at_start: false
power_off_at_end: false

topics:
  power: /robot_poweron
  joint_absolute: /arm_joint_absolute_cmd
  joint_state: /arm/joint_states
  motion_status: /arm/arm_controller/motion_status

services:
  cartesian_increment: /cartesian_increment_control

defaults:
  joint_vel: 0.5
  joint_acc: 0.5
  cartesian_vel: 0.02
  cartesian_acc: 0.05
  service_timeout: 90.0
  motion_timeout: 45.0
  position_tolerance: 0.05
  wait_motion: true
  confirm_after: false
  delay_after: 0.0
  cartesian_delay_after: 1.0
  joint_delay_after: 0.0
  ordered_delay: 0.0
  power_publish_repeats: 5
  power_publish_interval: 0.1
  joint_publish_repeats: 3
  joint_publish_interval: 0.05

initial_pose:
  l1: 0.0
  l2: 0.0
  l3: 0.0
  l4: 0.0
  l5: 0.0
  l6: 0.0
  l7: 0.0
  r1: 0.0
  r2: 0.0
  r3: 0.0
  r4: 0.0
  r5: 0.0
  r6: 0.0
  r7: 0.0

poses:
  抱大箱准备姿态:
    l1: 0.0
    l2: 0.8
    l3: 0.0
    l4: -1.5
    l5: 0.0
    l6: 0.0
    l7: 0.0
    r1: 0.0
    r2: -0.8
    r3: 0.0
    r4: 1.5
    r5: 0.0
    r6: 0.0
    r7: 0.0

  抬起小箱子（伸缩4cm）:
    l1: -1.9187942495966406
    l2: 0.2677395686105712
    l3: 1.7033538384730456
    l4: -1.7451548149429292
    l5: 0.28049078390987053
    l6: -1.3351505124808702
    l7: -0.5645049299419159
    r1: 1.9604753838174709
    r2: -0.2858717008923757
    r3: -1.7934033044118949
    r4: 1.819864473002922
    r5: -0.29680131400606086
    r6: 1.2175972503842276
    r7: 0.633809702569593

  准备抱紧大箱子（伸缩8cm）:
    l1: 0.17863685643924507
    l2: 0.30998396140195306
    l3: -0.22199578214682514
    l4: -1.548421778896596
    l5: -0.2594824376507805
    l6: -0.09214670529728668
    l7: -0.16592159381466173
    r1: -0.17796573984454508
    r2: -0.3261986176989005
    r3: 0.2226668987415251
    r4: 1.5051587269882587
    r5: 0.363757178552288
    r6: 0.16919328721382407
    r7: 0.16122377765176196

  全零位:
    l1: 0.0
    l2: 0.0
    l3: 0.0
    l4: 0.0
    l5: 0.0
    l6: 0.0
    l7: 0.0
    r1: 0.0
    r2: 0.0
    r3: 0.0
    r4: 0.0
    r5: 0.0
    r6: 0.0
    r7: 0.0

steps:
  - name: "0 上电"
    action: power
    enable: true

  - name: "1 运动到抱大箱准备姿态"
    action: joint
    pose: 抱大箱准备姿态
    order: [lrjoint2, lrjoint4]

  - name: "3 运动到抬起小箱子姿态"
    action: joint
    pose: 抬起小箱子（伸缩4cm）
    order:
      - lrjoint1
      - [lrjoint3, lrjoint4, lrjoint5, lrjoint6, lrjoint7]
      - lrjoint2

  - name: "4 下探26cm"
    action: cartesian_increment
    request:
      lz: -0.26
      rz: -0.26
    confirm_after: true

  - name: "5 内缩4cm"
    action: cartesian_increment
    request:
      ly: -0.05
      ry: 0.05

  - name: "6 上升26cm"
    action: cartesian_increment
    request:
      lz: 0.26
      rz: 0.26
    confirm_after: true

  - name: "7 运动到抬起小箱子姿态"
    action: joint
    pose: 抬起小箱子（伸缩4cm）

  - name: "8 下探35cm"
    action: cartesian_increment
    request:
      lz: -0.35
      rz: -0.35
    confirm_after: true

  - name: "9 内缩4cm"
    action: cartesian_increment
    request:
      ly: -0.05
      ry: 0.05

  - name: "10 上升35cm"
    action: cartesian_increment
    request:
      lz: 0.35
      rz: 0.35
    confirm_after: true

  - name: "11 运动到抱大箱准备姿态"
    action: joint
    pose: 抱大箱准备姿态
    order:
      - lrjoint2
      - [lrjoint7, lrjoint6, lrjoint5]
      - lrjoint4
      - lrjoint3
      - lrjoint1
    confirm_after: true

  - name: "12 运动到准备抱紧大箱子姿态"
    action: joint
    pose: 准备抱紧大箱子（伸缩8cm）

  - name: "13 内缩8cm"
    action: cartesian_increment
    request:
      ly: -0.09
      ry: 0.09
    confirm_after: true

  - name: "14 抬起10cm"
    action: cartesian_increment
    request:
      lz: 0.10
      rz: 0.10
    confirm_after: true

  - name: "15 下降10cm"
    action: cartesian_increment
    request:
      lz: -0.10
      rz: -0.10

  - name: "16 运动到抱大箱准备姿态"
    action: joint
    pose: 抱大箱准备姿态

  - name: "17 回到0位"
    action: joint
    pose: 全零位
    order: [lrjoint4, lrjoint2]

  # - name: "18 断电"
  #   action: power
  #   enable: false
