ubuntu_lower_gateway:
  ros__parameters:
    backend_plugin: robot_lower_gateway/ErobotBackend
    publish_rate_hz: 20.0

    heavy_v1:
      controller_rate_hz: 100.0
      command_rate_hz: 100.0
      feedback_rate_hz: 100.0
      status_rate_hz: 10.0
      command_hold_timeout_ms: 100
      # Arm power and canonical lift status are published at approximately
      # 10 Hz.  Three periods preserves the freshness safety gate while
      # avoiding false lease revocation from normal scheduler/DDS jitter.
      feedback_fault_timeout_ms: 300
      # workspace_supervisor_ubuntu publishes its heartbeat every 2 seconds.
      workspace_status_timeout_ms: 3000
      execution_lease_timeout_ms: 500
      startup_feedback_grace_ms: 2000
      controller_ack_timeout_ms: 200
      # Retransmit the same pending generation before its bounded ACK timeout.
      # Controllers treat the retransmit as an idempotent ACK request.
      controller_ack_retry_interval_ms: 50
      service_timeout_ms: 5000
      # Lease preparation powers only the lift drive to Operation Enabled and
      # waits for feedback. The first command remains a zero-velocity HOLD.
      lift_enable_timeout_ms: 1000
      arm_max_velocity_rad_s: 0.3
      # Match the established native joint-batch safety limit.  Heavy V1
      # validates every feedforward value before forwarding it.
      arm_max_acceleration_rad_s2: 1.0
      lift_min_position_m: -1.0
      lift_max_position_m: 0.0
      # Encoder noise around the mechanical upper/lower stops is tolerated
      # only for safety HOLD/STOP targets; motion targets remain strict.
      lift_position_tolerance_m: 0.002
      lift_max_velocity_mps: 0.060
      lift_max_acceleration_mps2: 0.10
      # Disabled arms may coexist with lift motion only when each arm target
      # explicitly holds its measured position with zero velocity/acceleration.
      allow_lift_only_follow: true
      lift_only_arm_hold_position_tolerance_rad: 0.001
      lift_native_name: joint_motor
      # The Heavy gateway only sends this native lock/unlock service on a
      # mode/lease safety edge; 100 Hz HOLD keepalives never call it.
      heavy_lift_brake_native_service: /lift_brake_command
      brake_lock_velocity_threshold_mps: 0.001
      arm_native_names:
        - ljoint1
        - ljoint2
        - ljoint3
        - ljoint4
        - ljoint5
        - ljoint6
        - ljoint7
        - rjoint1
        - rjoint2
        - rjoint3
        - rjoint4
        - rjoint5
        - rjoint6
        - rjoint7

    # The gateway is feedback-only by default. Enable this only after the
    # native Ubuntu control services have been verified in this workspace.
    enable_command_proxy: false
    command_proxy_prefix: "~/"

    # These are existing service owners in the target robot workspace. The
    # gateway forwards requests; it never writes a controller or PDO directly.
    native_services:
      power: /set_robot_power
      mode: /set_arm_control_mode
      joint_batch: /arm/joint_batch_control
      joint_absolute: /arm_absolute_control
      cartesian_increment: /cartesian_increment_control
      cartesian_absolute: /cartesian_absolute_control
      lift_power: /lift_brake_command
      lift_command: /joint/lift/command
      lift_stop: /joint/lift/stop
      lift_hold: /joint/lift/hold
      lift_set_drive_zero: /lift_set_drive_zero

    command_timeout_ms:
      power: 30000
      mode: 5000
      joint: 30000
      cartesian: 60000
      lift_power: 30000
      lift_command: 5000
      lift_safety: 5000
      lift_set_drive_zero: 10000

    lift:
      canonical_joint_name: joint_motor
      native_joint_name: joint_motor

    canonical_joint_names:
      - ljoint1
      - ljoint2
      - ljoint3
      - ljoint4
      - ljoint5
      - ljoint6
      - ljoint7
      - rjoint1
      - rjoint2
      - rjoint3
      - rjoint4
      - rjoint5
      - rjoint6
      - rjoint7

    # Native names may differ on another robot. Array order defines the mapping
    # to canonical_joint_names above.
    native_joint_names:
      - ljoint1
      - ljoint2
      - ljoint3
      - ljoint4
      - ljoint5
      - ljoint6
      - ljoint7
      - rjoint1
      - rjoint2
      - rjoint3
      - rjoint4
      - rjoint5
      - rjoint6
      - rjoint7

    topics:
      joint_state: /arm/joint_states
      power_status: /arm/power_status
      control_mode_status: /arm/control_mode_status
      motion_status: /arm/arm_controller/motion_status
      tcp_pose: /arm_tcp_pose
      execution_status: /arm_cartesian_path_execution_status
      workspace_status: /workspace/status
      lift_driver_status: /joint/lift/driver_status
      lift_control_status: /joint/lift/control_status
      lift_joint_state: /lift/joint_states

    # Vendor-specific values stay in the adapter profile, not the gateway.
    drive_status:
      enabled_codes: [39]
      unavailable_codes: [0]

    stale_timeout_ms:
      joint_state: 250
      power_status: 500
      control_mode: 500
      motion_status: 500
      tcp_pose: 500
      execution: 3000
      lift_status: 500
      lift_joint_state: 500
